# Fix redraw corruption over devpod ssh (\n becomes \r\n)
set -ag terminal-overrides ',*:cud1=\E[1B'

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,alacritty:RGB,xterm-256color:RGB"

# Mouse wheel scrolling
set -g mouse on

set -g history-limit 50000

# Copy mode (vi keys): prefix + [, v select, C-v block, y yank
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'wl-copy'

# prefix + P pastes (p stays previous-window)
bind P run "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# Mouse selection copies without jumping back to the prompt
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'wl-copy'
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe 'wl-copy'
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe 'wl-copy'

# OSC 52: let apps inside tmux (incl. over SSH) set the local clipboard
set -g set-clipboard on

# General
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10        # no Esc lag in nvim
set -g focus-events on
set -g display-time 2000
set-option -g status-position top
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Popups
set -g popup-border-lines rounded
set -g popup-border-style "fg=#d65d0e"

# prefix + t: floating shell
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}" -T " shell "

# prefix + s: zoomed session picker
bind s choose-tree -Zs

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Pane navigation with hjkl (last-window moves to L)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind L last-window

# Clicking doesn't switch panes (avoids accidental trackpad taps)
bind -n MouseDown1Pane send -M
bind -n MouseDown3Pane send -M
bind -T copy-mode-vi MouseDown1Pane send -X clear-selection

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'z3z1ma/tmux-gruvbox'
set -g @gruvbox_flavour 'dark'

# Window tabs (needs a Nerd Font)
set -g @gruvbox_window_left_separator ""
set -g @gruvbox_window_right_separator " "
set -g @gruvbox_window_middle_separator " █"
set -g @gruvbox_window_number_position "right"
set -g @gruvbox_window_default_fill "number"
set -g @gruvbox_window_current_fill "number"
set -g @gruvbox_window_default_text "#W"
set -g @gruvbox_window_current_text "#W#{?window_zoomed_flag,  ,}"

# Status modules: application session directory user host date_time cpu ram battery
set -g @gruvbox_status_modules_right "directory session"
set -g @gruvbox_status_left_separator " "
set -g @gruvbox_status_right_separator ""
set -g @gruvbox_status_fill "icon"
set -g @gruvbox_status_connect_separator "no"
set -g @gruvbox_directory_text "#{b:pane_current_path}"

# Visuals
set -g status-interval 5
set -g pane-border-lines heavy
set -g set-titles on
set -g set-titles-string "#S / #W"

run '~/.tmux/plugins/tpm/tpm'
