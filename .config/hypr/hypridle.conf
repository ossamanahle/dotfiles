general {
    lock_cmd       = pidof hyprlock || hyprlock   # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd  = hyprctl dispatch dpms on     # turn the display back on after wake
}

# 2.5 min: dim the backlight (saves current level, restores on activity)
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 30 min: lock the session (runs lock_cmd above)
listener {
    timeout    = 1800
    on-timeout = loginctl lock-session
}

# 1 hour: suspend the system
listener {
    timeout    = 3600
    on-timeout = systemctl suspend
}
