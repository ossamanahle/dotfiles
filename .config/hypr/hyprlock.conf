$font = JetBrainsMono Nerd Font

# Gruvbox dark palette
$bg     = rgba(282828ff)
$fg     = rgba(ebdbb2ff)
$yellow = rgba(fabd2fee)
$green  = rgba(b8bb26ee)
$aqua   = rgba(8ec07cee)
$red    = rgba(fb4934ee)
$orange = rgba(fe8019ee)

general {
    hide_cursor = true
}

# Blurred screenshot of the desktop as the lock background
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(28282899)

    outer_color = $yellow $aqua 45deg
    check_color = $green $aqua 120deg
    fail_color  = $red $orange 40deg

    font_color     = $fg
    fade_on_empty  = false
    rounding       = 15
    font_family    = $font
    placeholder_text = <i>Input password...</i>
    fail_text        = <i>$FAIL <b>($ATTEMPTS)</b></i>
    dots_spacing   = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 24
    font_family = $font
    position = 0, 220
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi, $USER
    font_size = 20
    font_family = $font
    position = 0, -160
    halign = center
    valign = center
}
