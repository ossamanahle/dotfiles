# Vim-mode keybindings for Ghostty (key tables, Ghostty >= 1.3).
# Based on Mitchell Hashimoto's config:
# https://github.com/ghostty-org/ghostty/discussions/3708#discussioncomment-15329614
# Tweaked to match the old Alacritty vi-mode bindings.
#
# Limitations (Ghostty 1.3): this scrolls the viewport; there is no movable
# caret and no keyboard-driven selection yet. Select with the mouse, then `y`.

# Entry point (Ctrl+Space like Alacritty; Alt+V as Mitchell's default)
keybind = ctrl+space=activate_key_table:vim
keybind = alt+v=activate_key_table:vim

# Key table definition (clears/creates it)
keybind = vim/

# Line movement
keybind = vim/j=scroll_page_lines:1
keybind = vim/k=scroll_page_lines:-1
keybind = vim/arrow_down=scroll_page_lines:1
keybind = vim/arrow_up=scroll_page_lines:-1

# Half page (Shift+J/K like Alacritty, plus vim's Ctrl+D/U)
keybind = vim/shift+j=scroll_page_fractional:0.5
keybind = vim/shift+k=scroll_page_fractional:-0.5
keybind = vim/ctrl+d=scroll_page_fractional:0.5
keybind = vim/ctrl+u=scroll_page_fractional:-0.5

# Full page (Shift+D/U like Alacritty, plus vim's Ctrl+F/B)
keybind = vim/shift+d=scroll_page_down
keybind = vim/shift+u=scroll_page_up
keybind = vim/ctrl+f=scroll_page_down
keybind = vim/ctrl+b=scroll_page_up
keybind = vim/page_down=scroll_page_down
keybind = vim/page_up=scroll_page_up

# Top / bottom
keybind = vim/g>g=scroll_to_top
keybind = vim/shift+g=scroll_to_bottom
keybind = vim/home=scroll_to_top
keybind = vim/end=scroll_to_bottom

# Search
keybind = vim/slash=start_search
keybind = vim/n=navigate_search:next
keybind = vim/shift+n=navigate_search:previous

# Copy (mouse selection) to clipboard
keybind = vim/y=copy_to_clipboard
keybind = vim/v=copy_to_clipboard

# Command palette
keybind = vim/shift+semicolon=toggle_command_palette

# Exit (also jumps back to the prompt)
keybind = vim/escape=deactivate_key_table
keybind = chain=scroll_to_bottom
keybind = vim/q=deactivate_key_table
keybind = chain=scroll_to_bottom
keybind = vim/i=deactivate_key_table
keybind = chain=scroll_to_bottom
keybind = vim/ctrl+space=deactivate_key_table
keybind = chain=scroll_to_bottom

# Swallow every other key so nothing leaks into the shell
keybind = vim/catch_all=ignore
