"$schema" = 'https://starship.rs/config-schema.json'

# Minimal single-line prompt: directory + git + arrow
add_newline = false

format = "$directory$git_branch$git_status$character"

[directory]
style = "blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "green"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "dimmed yellow"

[character]
success_symbol = "[>](green)"
error_symbol = "[>](red)"
vimcmd_symbol = "[<](green)"
