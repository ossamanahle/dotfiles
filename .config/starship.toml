"$schema" = 'https://starship.rs/config-schema.json'

# Minimal two-line prompt: user@host:dir git duration / arrow
add_newline = true

format = "$username@$hostname:$directory$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
format = "$user"

[hostname]
ssh_only = false
format = "$hostname"

[directory]
style = "blue"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "green"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "dimmed yellow"

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "λ $duration"

[character]
success_symbol = "[>](green)"
error_symbol = "[>](red)"
vimcmd_symbol = "[<](green)"
