# FONT
[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"

# WINDOW
[window]
padding = { x = 10, y = 10 }

# SCROLLBACK
[scrolling]
history = 10000

# MOUSE
[mouse]
hide_when_typing = true

# CURSOR
[cursor.style]
shape = "Underline"
blinking = "On"

[cursor.vi_mode_style]
shape = "Block"

[cursor]
unfocused_hollow = false
blink_timeout = 0
thickness = 0.08

# KEYBINDINGS
[[keyboard.bindings]]
key = "Space"
mods = "Control"
action = "ToggleViMode"

# COLORS - Gruvbox Material Dark Medium
[colors.primary]
background = "#282828"
foreground = "#d4be98"

[colors.cursor]
text = "#282828"
cursor = "#a89984"

[colors.selection]
text = "#282828"
background = "#d4be98"

[colors.normal]
black   = "#665c54"
red     = "#ea6962"
green   = "#a9b665"
yellow  = "#e78a4e"
blue    = "#7daea3"
magenta = "#d3869b"
cyan    = "#89b482"
white   = "#d4be98"

[colors.bright]
black   = "#928374"
red     = "#ea6962"
green   = "#a9b665"
yellow  = "#d8a657"
blue    = "#7daea3"
magenta = "#d3869b"
cyan    = "#89b482"
white   = "#d4be98"
