# cud1=\n gets rewritten to \r\n by ONLCR ptys (devpod ssh --stdio), which
# snaps the cursor to column 0 and corrupts redraws. \E[1B can't be rewritten.
set -ag terminal-overrides ',*:cud1=\E[1B'

# === Scrolling ===
# The reason the mouse wheel did nothing: tmux ignores the mouse by default.
# With this on, the wheel enters copy-mode and scrolls the scrollback buffer.
set -g mouse on

# 2000 lines is tmux's default and it is small -- one verbose build or a
# `kubectl logs` and the top is already gone. 50k lines per pane.
set -g history-limit 50000

# === Copy mode ===
# vi keys in copy-mode, to match how you already move around in nvim.
setw -g mode-keys vi

# Enter copy-mode with prefix + [ , then:
#   v      start selection      (like visual mode)
#   C-v    rectangle/block selection
#   y      yank and exit
#   q      quit
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Wayland session, so wl-copy is the clipboard. `copy-pipe-and-cancel` sends
# the selection to wl-copy AND exits copy-mode in one step.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'wl-copy'

# Prefix + p pastes back into the terminal.
bind p run "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# === Mouse selection ===
# By default, releasing the mouse button copies the selection *and* jumps you
# back to the prompt, which loses your scroll position. These keep you where
# you were, so you can keep reading after copying.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'wl-copy'
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe 'wl-copy'
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe 'wl-copy'

# === Clipboard passthrough (OSC 52) ===
# `on` lets programs *inside* tmux (nvim's "+y, over SSH into your devcontainer)
# set your local clipboard via an escape sequence. The default `external` only
# forwards to the outer terminal; `on` makes tmux answer directly too.
# Alacritty supports OSC 52, so this works end to end.
set -g set-clipboard on

# === Quality of life ===
set -g base-index 1           # windows start at 1, matching the number keys
setw -g pane-base-index 1
set -g renumber-windows on    # closing window 2 renumbers 3->2, no gaps
set -sg escape-time 10        # don't misread <Esc> as Alt- ; nvim feels snappier
set -g focus-events on        # let nvim autoread files changed outside
set -g display-time 2000      # status messages stay readable

# Reload this file without restarting tmux.
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
