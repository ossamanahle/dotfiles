# Font
[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"

# Window
[window]
padding = { x = 10, y = 10 }

# Scrollback
[scrolling]
history = 10000

# Mouse
[mouse]
hide_when_typing = true

# Cursor
[cursor.style]
shape = "Underline"
blinking = "On"

[cursor.vi_mode_style]
shape = "Block"

[cursor]
unfocused_hollow = false
blink_timeout = 0
thickness = 0.08

# Keybindings
[[keyboard.bindings]]
key = "Space"
mods = "Control"
action = "ToggleViMode"

# Gruvbox Material Dark
[colors.primary]
background = "#282828"
foreground = "#d4be98"

[colors.cursor]
text = "#282828"
cursor = "#a89984"

[colors.selection]
text = "#282828"
background = "#d4be98"

[colors.normal]
black   = "#665c54"
red     = "#ea6962"
green   = "#a9b665"
yellow  = "#e78a4e"
blue    = "#7daea3"
magenta = "#d3869b"
cyan    = "#89b482"
white   = "#d4be98"

[colors.bright]
black   = "#928374"
red     = "#ea6962"
green   = "#a9b665"
yellow  = "#d8a657"
blue    = "#7daea3"
magenta = "#d3869b"
cyan    = "#89b482"
white   = "#d4be98"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Vi mode fast scrolling (no count support in vi mode)

# Shift+J/K = half page
[[keyboard.bindings]]
key = "J"
mods = "Shift"
mode = "Vi|~Search"
action = "ScrollHalfPageDown"

[[keyboard.bindings]]
key = "K"
mods = "Shift"
mode = "Vi|~Search"
action = "ScrollHalfPageUp"

# Shift+D/U = full page
[[keyboard.bindings]]
key = "D"
mods = "Shift"
mode = "Vi|~Search"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "U"
mods = "Shift"
mode = "Vi|~Search"
action = "ScrollPageUp"

# Home/End = gg/G
[[keyboard.bindings]]
key = "Home"
mode = "Vi|~Search"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mode = "Vi|~Search"
action = "ScrollToBottom"
